# Сборка и релиз под ту единственную цель, в которой имеет смысл DLL:
# Terraria 1.4.5 — 32-битный процесс, значит i686-pc-windows-msvc.
#
# Ветка одна, как в GitHub Flow. Релиз выкладывается сам, по версии из
# Cargo.toml: как только в main приезжает коммит с новой версией, для неё
# заводится тег и релиз. Тег руками пушить не нужно — именно на этом
# спотыкались раньше: `git push` теги сам не отправляет, поэтому сборка
# запускалась от ветки, а шаг релиза пропускался.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Ручной запуск: собрать и выложить, ничего не коммитя.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Нужны теги: по ним проверяется, выкладывали эту версию или нет.
          fetch-depth: 0

      - name: Поставить цель сборки
        run: rustup target add i686-pc-windows-msvc

      # Кэш заметно экономит время: зависимостей немного, но windows-crate
      # собирается долго.
      - uses: Swatinem/rust-cache@v2
        with:
          key: i686-pc-windows-msvc

      - name: Проверить форматирование
        run: cargo fmt --all --check

      - name: Проверить clippy
        run: cargo clippy --release --target i686-pc-windows-msvc

      - name: Тесты
        run: cargo test --release --target i686-pc-windows-msvc

      - name: Собрать DLL
        run: cargo build --release --target i686-pc-windows-msvc

      # Артефакт к каждой сборке: удобно забрать DLL и без релиза.
      - name: Приложить DLL к сборке
        uses: actions/upload-artifact@v5
        with:
          name: piscatio-dll
          path: target/i686-pc-windows-msvc/release/piscatio.dll
          if-no-files-found: error

      # Версия — из Cargo.toml, она же в свойствах DLL и в заголовке панели.
      # Заодно смотрим, не выкладывали ли её уже: иначе каждый пуш в main
      # переписывал бы один и тот же релиз.
      #
      # Заметки к релизу — сообщение того коммита, которым версию и привезли.
      # Автосводка GitHub давала одну строку «Full Changelog», а осмысленное
      # описание пишется руками в коммите, его и берём.
      - name: Узнать версию и заметки
        id: meta
        shell: pwsh
        run: |
          # Без этого git отдаёт кириллицу в другой кодировке и в релиз
          # уезжают кракозябры.
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $line = Get-Content Cargo.toml | Select-String -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $version = $line.Matches[0].Groups[1].Value
          $tag = "v$version"
          $exists = ""
          if (git ls-remote --tags origin "refs/tags/$tag") { $exists = "yes" }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "exists=$exists" -Encoding utf8

          $notes = ((git log -1 --pretty=%B) -join "`n").Trim()
          if (-not $notes) { $notes = $tag }
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          Write-Output "версия $version, тег $tag, уже выложен: '$exists'"
          Write-Output "заметки:`n$notes"

      # Релиз выкладывается, когда версия новая либо когда тег пришёл руками.
      # `action-gh-release` сам заводит тег на текущем коммите, если его нет.
      - name: Выложить релиз
        if: steps.meta.outputs.exists == '' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          files: target/i686-pc-windows-msvc/release/piscatio.dll
          body_path: release-notes.md
