[build]
target = "i686-pc-windows-msvc"
# Кадровый указатель нужен не нам, а чужой сборке мусора. Детур стоит
# на первых байтах managed-метода, и CLR, разбирая стек нашего потока,
# проходит через кадры piscatio.dll. На x86 она делает это по цепочке EBP,
# а при `opt-level = "z"` компилятор её не строит.
rustflags = ["-C", "force-frame-pointers=yes"]
