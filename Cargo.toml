[package]
name = "terraria-piscatio-automatica"
version = "0.1.2"
edition = "2024"

[lib]
name = "piscatio"
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_ClrHosting", "Win32_System_Variant", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Ole", "Win32_System_SystemInformation"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
