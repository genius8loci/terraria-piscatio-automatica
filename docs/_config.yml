# Настройки GitHub Pages. Источник сайта — папка docs в ветке main,
# поэтому и файл лежит здесь, а не в корне репозитория.
#
# Без index-страницы Pages отдавал 404: корневой URL ищет именно индекс,
# а `research.md` рядом ему не подходит. Поэтому текст живёт в `index.md`.

title: terraria piscatio automatica
description: >-
  Как устроена авторыбалка для Terraria 1.4.5: разбор игры, детуры,
  оверлей на родных текстурах и грабли рефлексии.

# Готовая тема GitHub Pages: заголовок, кнопка «View on GitHub»
# и читаемая вёрстка таблиц и кода — без своей вёрстки.
theme: jekyll-theme-cayman

# Передача дел — рабочая записка, а не документация. В `.gitignore` она
# уже есть, но пусть Jekyll не подхватит её и локально.
exclude:
  - next-steps.md
